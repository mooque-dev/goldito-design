<!-- expressive:start — the Expressive look on top of the journey (same flows, brand green + tag gold, Fredoka = the logo's face; DESIGN.md §3.2) -->
<style id="expressive">
:root{--bg:#FBF6EA;--surface:#FFFFFF;--text:#1A1A1A;--text-muted:#4F5B53;--border:#E3EADF;
  --primary:#2D6A4F;--primary-foreground:#FFFFFF;--primary-text:#2D6A4F;--primary-soft:#D8F3DC;
  --tint-bg:#FFF9F0;--tint-surface:#FFFFFF;--tint-border:#E3EADF;
  --x-ink:#1B4332;--x-mint:#D8F3DC;--x-peach:#FDE2CC;--x-butter:#FBEFC8;--x-blush:#FAD6CB;--x-gold:#F4C35A;--x-gold-ink:#8A5A00;
  --radius-sm:.875rem;--radius-md:1.125rem;--radius-lg:1.625rem;--shadow-1:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121312;--surface:#1A1B1A;--text:#EDEDEA;--text-muted:#A3A39C;--border:#2C2D2B;
  --primary:#7CCBA2;--primary-foreground:#0E1210;--primary-text:#7CCBA2;--primary-soft:#1E3128;--tint-bg:#121312;--tint-surface:#1A1B1A;--tint-border:#2C2D2B;
  --x-ink:#D8F3DC;--x-mint:#1E3128;--x-peach:#3A2A1F;--x-butter:#36301A;--x-blush:#3A2421;--x-gold:#F4C35A;--x-gold-ink:#F4C35A}}
:root[data-theme="dark"]{--bg:#121312;--surface:#1A1B1A;--text:#EDEDEA;--text-muted:#A3A39C;--border:#2C2D2B;
  --primary:#7CCBA2;--primary-foreground:#0E1210;--primary-text:#7CCBA2;--primary-soft:#1E3128;--tint-bg:#121312;--tint-surface:#1A1B1A;--tint-border:#2C2D2B;
  --x-ink:#D8F3DC;--x-mint:#1E3128;--x-peach:#3A2A1F;--x-butter:#36301A;--x-blush:#3A2421;--x-gold:#F4C35A;--x-gold-ink:#F4C35A}
.jr,.jr-danger,.jr-overlay{--jr-font-head:"Fredoka","Arial Rounded MT Bold",ui-rounded,sans-serif;--jr-head-weight:600;--jr-radius:1.625rem;--jr-card-border:none;--jr-card-shadow:none}
.jr-title{font-size:2.125rem;font-weight:700;letter-spacing:-.01em;color:var(--x-ink)}
.jr-eyebrow{color:var(--x-gold-ink)}
.jr-h3,.jr-stage-title b{letter-spacing:0;color:var(--x-ink)}
/* Color-blocked stages: each stage keeps its own pastel, so the five steps read at a glance */
.jr-stage{border:none;box-shadow:none}
.jr-stage[data-i="0"]{background:var(--x-mint)}.jr-stage[data-i="1"]{background:var(--x-peach)}
.jr-stage[data-i="2"]{background:var(--x-butter)}.jr-stage[data-i="3"]{background:var(--x-blush)}
.jr-stage[data-i="4"]{background:var(--x-mint)}
.jr-stage .jr-card{background:var(--surface)}
.jr-stage-head{position:relative}
.x-art{width:52px;height:52px;flex:0 0 auto;margin:-6px -4px -6px auto}
/* Controls: ink pill when selected, white when not; buttons are bold pills */
.chip{background:var(--surface);border-color:transparent;font-weight:700}
.chip.active{background:var(--x-ink);color:var(--bg);border-color:var(--x-ink)}
.btn{border-radius:999px;font-weight:800}
.btn-secondary{background:var(--surface);border:2px solid var(--x-ink);color:var(--x-ink)}
.jr-datefield{background:var(--surface);border:2px solid var(--x-ink)}
.jr-day.on{background:var(--x-ink);color:var(--bg)}
/* The logo: the gold tag (brand v2.1) and the lowercase wordmark in Fredoka */
.brand{font-family:"Fredoka","Arial Rounded MT Bold",ui-rounded,sans-serif;font-weight:600;font-size:1.125rem;letter-spacing:0;color:var(--x-ink);text-transform:lowercase}
.brand-mark{background:none !important;width:1.875rem !important;height:1.875rem !important}
.brand-mark img{width:100%;height:100%;display:block}
/* Gold marks the moments worth celebrating: done steps and the progress you've made */
.jr-stage.is-done .jr-num{background:var(--x-gold);color:#3D2A00}
.jr-progress i.on{background:var(--x-gold)}
/* Pages layout: gold for done steps and the line up to them, ink for where you are */
.jr-stepper .is-done .jr-num{background:var(--x-gold);color:#3D2A00}
.jr-stepper li.is-done+li::before{background:var(--x-gold)}
.jr-stepper .is-current .jr-num{background:var(--x-ink);color:var(--bg)}
.jr-stepper .is-viewing .jr-num{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--x-ink)}
.jr-step-l{font-family:"Fredoka","Arial Rounded MT Bold",ui-rounded,sans-serif;font-weight:600;font-size:.75rem}
.jr-pg{color:var(--x-ink)}
/* Tab bar: white sheet, mint pill + ink icon on the active tab */
.tabbar{border-radius:1.625rem 1.625rem 0 0;box-shadow:0 -8px 24px rgba(27,67,50,.08)}
.tab[aria-current="page"]{color:var(--x-ink)}
</style>

// Illustrations sit in a fixed slot on each stage header (never over content). Placeholder set: redesign/art.svg.
(() => {
  const ART = ["art-dog", "art-walk", "art-home", "art-camera", "art-ball"];
  fetch("redesign/art.svg").then((r) => r.text()).then((svg) => {
    document.body.insertAdjacentHTML("afterbegin", svg);
    const add = () => document.querySelectorAll(".jr-stage").forEach((st, k) => {
      const head = st.querySelector(".jr-stage-head"), i = st.dataset.i != null ? Number(st.dataset.i) : k;
      if (!head || head.querySelector(".x-art")) return;
      head.insertAdjacentHTML("beforeend", `<svg class="x-art" aria-hidden="true"><use href="#${ART[i % ART.length]}"/></svg>`);
    });
    add(); new MutationObserver(add).observe(document.body, {childList: true, subtree: true});
  }).catch(() => {});
})();
