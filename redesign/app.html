<style>
/* Tokens = frontend/theme/tokens.ts (+ shadcn-style elevation). */
:root{
  --background:#F7F7F5; --surface:#FFFFFF; --text:#1A1A1A; --text-muted:#5C5C5C; --primary:#2D6A4F; --primary-text:#FFFFFF;
  --accent:#D8F3DC; --border:#E5E5E0; --border-strong:#86867F; --track:#E5E5E0; --error-surface:#FEF3F2; --warning-surface:#FFFAEB; --success-surface:#ECFDF3; --error:#B42318; --success:#067647; --warning:#B54708;
  --xs:4px; --sm:8px; --md:16px; --lg:24px; --xl:32px; --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow-xs:0 1px 2px 0 rgba(0,0,0,.05); --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
  --page:var(--color-background); --page-text:var(--color-text); --page-muted:var(--color-text-muted);
}
*{box-sizing:border-box}

.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--page-muted)}
.legend b{color:var(--page-text)}
section.pair{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
@media (max-width:980px){section.pair{grid-template-columns:1fr}}
.col h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--page-muted);margin:0 0 10px}
.shot{width:100%;max-width:360px;border-radius:28px;border:6px solid #1A1A1A;display:block;background:#fff}
.notes h3{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}

/* ---------- phone + app (design system) ---------- */
.phone{width:360px;max-width:100%;height:760px;border-radius:28px;border:6px solid #1A1A1A;background:var(--background);color:var(--text);
  display:flex;flex-direction:column;overflow:hidden;position:relative;font-size:14px}

.icons{display:flex;gap:4px}

.scroll>*{flex-shrink:0}

.pad{padding:var(--md)}
.row{display:flex;align-items:center;gap:var(--sm)}
.between{display:flex;align-items:center;justify-content:space-between;gap:var(--sm)}
.stack{display:flex;flex-direction:column;gap:var(--sm)}
.muted{color:var(--text-muted)} .small{font-size:12.5px} .tiny{font-size:11px}

.pill.live{background:var(--accent);color:var(--primary)} .pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--success)}
.pill.line{border:1px solid var(--border);color:var(--text)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:var(--r-md);font-weight:600;font-size:15px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-text);box-shadow:var(--shadow-xs)}
.btn.sec{background:var(--surface);color:var(--primary);border-color:var(--border-strong)}
.btn svg{width:18px;height:18px}
/* Interactive vs information (DESIGN.md §6.2): actions get an outline or fill and a chevron; information never does. */
.act{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 12px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-lg)}

.act .ic svg,.act .go{width:20px;height:20px}
.act .go{color:var(--text-muted);margin-left:auto;flex:0 0 auto}
.acts{display:flex;flex-direction:column;gap:8px}
.checks4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text)}
.ck svg{width:22px;height:22px;color:var(--primary)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-sm);padding:2px 8px;font-size:11.5px;font-weight:600;background:var(--accent);color:var(--primary)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.meter{display:flex;gap:4px;background:var(--track);border-radius:var(--r-md);padding:3px}
.meter span{flex:1;text-align:center;border-radius:calc(var(--r-md) - 3px);padding:5px;font-size:12px;font-weight:600;color:var(--text-muted)}
.meter span.on{background:var(--surface);color:var(--primary)}
.go{width:18px;height:18px;color:var(--text-muted)}
.link{color:var(--primary);font-weight:600;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);min-height:36px;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}
.chip.soft{background:var(--accent);border-color:transparent;color:var(--primary)}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden}
.photo{background-size:cover;background-position:center;border-radius:var(--r-md)}

.prog{display:flex;gap:4px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--track)}.prog i.on{background:var(--primary)}
.divider{height:1px;background:var(--border)}
.tabs{display:flex;justify-content:space-around;padding:6px 6px 16px;background:var(--surface);border-top:1px solid var(--border)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--text-muted);width:62px}
.tab .p{width:50px;height:28px;border-radius:14px;display:grid;place-items:center}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--primary)} .tab.on .p{background:var(--accent)}
.pinned{padding:var(--sm) var(--md) var(--sm);background:var(--background)}
.tl{display:flex;flex-direction:column}
.tl .it{display:grid;grid-template-columns:44px 14px 1fr;gap:8px;align-items:start;padding-bottom:12px}

.task{border:2px solid var(--primary)}
.bubble{background:var(--background);border:1px solid var(--border);border-radius:14px;padding:12px;font-size:13.5px;line-height:1.5}
.skinbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:13px}

/* Snap · Settings · What's New (Oct 15) */
.tool{display:grid;grid-template-columns:44px 1fr 18px;gap:12px;align-items:center}

.sw.off{background:var(--border-strong)}.sw.off::after{right:auto;left:3px}
.rn{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.45}
.noshot{display:flex;flex-direction:column;gap:6px;justify-content:center;align-items:center;text-align:center;padding:24px;border:2px dashed var(--border-strong);border-radius:24px;color:var(--text-muted);min-height:280px;font-size:14px}
.noshot b{color:var(--text);font-size:16px}

.xp .ch-who{display:flex;align-items:center;gap:12px;padding-left:4px}
.xp .ch-who>div{flex:1;min-width:0}
.xp .ch-name{font:600 24px/1.1 var(--display);color:var(--ink);margin:0}
.xp .ch-stayline{margin-top:2px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp .ch-face{width:44px;height:44px;border-radius:50%;flex:0 0 auto;background-size:cover;background-position:center;display:grid;place-items:center;font-weight:800;font-size:18px}
.xp .ch-face.sm{width:40px;height:40px}
.xp .ch-face svg{width:30px;height:30px}
.xp .ch-pets{display:flex;gap:6px;flex:0 0 auto}
/* Stage bar: five connected circles. Pressable (opens the booking) = outline + chevron; no booking yet = plain tint. */
.xp .ch-stage{margin:4px 16px 0;padding:10px 12px 10px 10px;border-radius:22px;background:var(--card);display:flex;align-items:center;gap:8px}
.xp .ch-stage.ch-go{border:2px solid var(--ink)}
.xp .ch-stage>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.xp .ch-stage>svg{width:22px;height:22px;flex:0 0 auto;color:var(--ink)}
.xp .ch-steps{display:flex;align-items:flex-start}
.xp .ch-step{width:44px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
.xp .ch-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--card);border:1.5px solid var(--line);color:var(--muted)}
.xp .ch-step.d .ch-dot{background:var(--gold);border-color:var(--gold);color:#3D2A00}
.xp .ch-step.c{color:var(--ink)} .xp .ch-step.c .ch-dot{background:var(--green);border-color:var(--green);color:#fff}
.xp .ch-link{flex:1;min-width:4px;height:2px;border-radius:1px;background:var(--line);margin-top:11px}
.xp .ch-link.on{background:var(--gold)}
.xp .ch-cap{font-size:12.5px;font-weight:800;color:var(--green);padding-left:8px}
/* Thread */
.xp .ch-msgs{flex:1;overflow:hidden;padding:12px 16px 6px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.xp .ch-msgs>*{flex-shrink:0}
.xp .ch-msgs.ch-up{justify-content:flex-start}
.xp .ch-day{align-self:center;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:800;color:var(--muted);background:rgba(127,111,88,.12)}
.xp .ch-m{display:flex;flex-direction:column;gap:3px;max-width:84%}
.xp .ch-m.ch-out{align-self:flex-end;align-items:flex-end} .xp .ch-m.ch-in{align-self:flex-start;align-items:flex-start}
.xp .ch-b{padding:10px 14px;border-radius:20px;font-size:14.5px;line-height:1.45}
.xp .ch-m.ch-out .ch-b{background:var(--green);color:#fff;border-bottom-right-radius:6px}
.xp .ch-m.ch-in .ch-b{background:var(--card);color:var(--text);border:1px solid var(--line);border-bottom-left-radius:6px}
.xp .ch-meta{font-size:11.5px;font-weight:600;color:var(--muted);padding:0 4px}
/* Cards in the thread take the sides of the bubbles: theirs white (left tail), the booking's own steps mint and centred */
.xp .ch-card{background:var(--card);border:1px solid var(--line);border-radius:24px;border-bottom-left-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.xp .ch-card.mine{background:var(--mint);border-color:var(--green);border-radius:24px;border-bottom-right-radius:6px}
.xp .ch-sys{align-self:center;width:92%;border-radius:18px;background:var(--mint);padding:9px 14px;display:flex;flex-direction:column;gap:1px;font-size:13px}
.xp .ch-sys b{font-weight:800;color:var(--ink);font-size:14px}
.xp .ch-quote{align-self:flex-start;width:92%;gap:6px}
.xp .ch-qhead{display:flex;align-items:center;gap:8px}
.xp .ch-qhead>span:first-child{flex:1;min-width:0;font:600 20px/1.1 var(--display);color:var(--ink)}
.xp .ch-lines{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.xp .ch-total{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding-top:9px;margin-top:3px}
.xp .ch-total>span:first-child{flex:1;min-width:0;font-weight:800}
.xp .ch-total>b{font:600 22px/1 var(--display);color:var(--ink)}
.xp .ch-acts{display:flex;align-items:center;gap:8px;margin-top:8px}
.xp .ch-acts .btn{flex:1;min-width:0}
.xp .ch-text{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 10px;font-weight:800;font-size:15px;color:var(--green)}
.xp .ch-text.danger{color:var(--danger)}
.xp .ch-stay{align-self:flex-start;max-width:88%;gap:8px}
.xp .ch-mini{display:flex;gap:6px}
.xp .ch-mini span{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px 2px 3px;font-size:12.5px;font-weight:800;color:var(--ink)}
.xp .ch-mini svg{width:24px;height:24px}
/* Footer step, reply chips and the message box */
.xp .ch-foot{padding:4px 16px 2px;display:flex;flex-direction:column;gap:8px}
.xp .ch-draft{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.xp .ch-draft .ch-row{display:flex;align-items:center;gap:10px}
.xp .ch-draft .ch-row>div{flex:1;min-width:0}
.xp .ch-chips{display:flex;gap:8px;padding:8px 16px 0;overflow:hidden}
.xp .ch-chip{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);border:1.5px solid #7F6F58;font-weight:700;font-size:14px;color:var(--text);white-space:nowrap;flex:0 0 auto}
.xp .ch-chip.on{background:var(--mint);border:2px solid var(--ink);color:var(--ink)}
.xp .ch-compose{display:flex;align-items:flex-end;gap:8px;padding:8px 16px 20px}
.xp .ch-plus{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:var(--card);border:1.5px solid #7F6F58;color:var(--green)}
.xp .ch-plus svg,.xp .ch-ico svg,.xp .ch-tog svg{width:22px;height:22px}
.xp .ch-input{flex:1;min-width:0;min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);padding:11px 16px;font-size:14.5px;color:var(--muted)}
.xp .ch-send{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--line);color:var(--muted)}
/* Sheets over the chat: scrim + white sheet with grab handle, title and Close */
.xp .ch-scrim{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(16,28,22,.48)}
.xp .ch-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:28px 28px 0 0;padding:8px 20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.xp .ch-grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line);flex:0 0 auto}
.xp .ch-shead{display:flex;align-items:center;gap:10px}
.xp .ch-shead h2{flex:1;min-width:0;margin:0;font:600 23px/1.15 var(--display);color:var(--ink)}
.xp .ch-shead .ch-text{padding:0 4px}
.xp .ch-lab{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.xp .ch-pet{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 14px 4px 4px;font-weight:800;font-size:15px;color:var(--ink)}
.xp .ch-pet .ch-face{width:34px;height:34px}
.xp .ch-pet .ch-face svg{width:26px;height:26px}
.xp .ch-hcard{border:1.5px solid var(--line);border-radius:22px;padding:6px 14px;display:flex;flex-direction:column}
.xp .ch-hrow{display:flex;flex-direction:column;gap:2px;padding:8px 0}
.xp .ch-hrow+.ch-hrow{border-top:1px solid var(--line)}
.xp .ch-when{display:flex;align-items:center;gap:8px}
.xp .ch-when>b{width:78px;flex:0 0 auto;font-weight:800;font-size:15px}
.xp .ch-pill{min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:14px;border:1.5px solid #7F6F58;background:var(--card);font-weight:700;font-size:15px;color:var(--text)}
.xp .ch-place{display:flex;align-items:center;gap:8px}
.xp .ch-place>span:first-child{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--muted)}
.xp .ch-noteline{display:flex;align-items:center;gap:10px}
.xp .ch-noteline>b{flex:1;min-width:0;font-weight:800;font-size:15px}
.xp .ch-tog{width:44px;height:44px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;border:1.5px solid #7F6F58;background:var(--card);color:var(--green)}
.xp .ch-info{border-radius:22px;background:var(--cream);padding:4px 16px;display:flex;flex-direction:column}
.xp .ch-info>div{display:flex;flex-direction:column;gap:2px;padding:10px 0}
.xp .ch-info>div+div{border-top:1px solid var(--line)}
.xp .ch-info .ch-l{font-size:14.5px;color:var(--text)}
.xp .ch-wrap{display:flex;flex-wrap:wrap;gap:8px}
.xp .ch-field{display:flex;flex-direction:column;gap:6px}
.xp .ch-field>b{font-weight:800;font-size:14px}
.xp .ch-area{min-height:88px;border-radius:16px;border:1.5px solid #7F6F58;background:var(--card);padding:12px 14px;font-size:14.5px;color:var(--text)}
.xp .ch-btn-danger{background:var(--danger);color:#fff}
.xp .ch-list{display:flex;flex-direction:column;gap:8px}
.xp .ch-ico{width:44px;height:44px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;background:var(--mint);color:var(--green)}
.xp .ch-off{display:flex;align-items:center;gap:12px;min-height:60px;border-radius:22px;padding:8px 14px 8px 8px;background:var(--cream);color:var(--muted);font-weight:700}
.xp .ch-off>span:nth-child(2){flex:1;min-width:0}
.xp .ch-off .ch-ico{background:rgba(127,111,88,.12);color:var(--muted)}
.xp .ch-hint{font-size:12.5px;font-weight:800;color:var(--muted)}
.xp .ch-act{min-height:60px}
.xp .ch-act .b{font-size:15px}
/* people.html */
/* People, pets, schedule (pp-). Detail pages: back + title, no tab bar. */
.xp .pp-top{align-items:flex-start}
.xp .pp-top>div:first-child{flex:1;min-width:0}
.xp .pp-hact{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;color:var(--green);font-weight:800;font-size:14px}
.xp .pp-hact svg{width:20px;height:20px}
/* Pet hero: cover photo with a camera badge, facts, photo strip */
.xp .pp-hero{display:flex;align-items:center;gap:14px;padding:14px 16px}
.xp .pp-cover{position:relative;width:88px;height:92px;flex:0 0 auto}
.xp .pp-cover .photo{position:absolute;left:0;bottom:0;width:84px;height:84px;border-radius:50%;border:3px solid #fff}
.xp .pp-cam{position:absolute;top:0;right:0;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;border:2.5px solid var(--peach)}
.xp .pp-cam svg{width:18px;height:18px}
.xp .pp-strip{display:flex;gap:6px;margin-top:8px}
.xp .pp-thumb{position:relative;width:48px;height:48px;flex:0 0 auto}
.xp .pp-thumb .photo{position:absolute;left:0;bottom:0;width:44px;height:44px;border-radius:50%}
.xp .pp-minus{position:absolute;top:0;right:0;width:20px;height:20px;border-radius:50%;background:var(--danger);border:2px solid var(--peach);display:grid;place-items:center}
.xp .pp-minus::after{content:"";width:8px;height:2px;border-radius:1px;background:#fff}
.xp .pp-plus{width:44px;height:44px;border-radius:50%;background:var(--card);border:1.5px solid #7F6F58;display:grid;place-items:center;color:var(--green);font:700 22px/1 "Plus Jakarta Sans",sans-serif;align-self:flex-end}
/* Personality chart */
.xp .pp-glance{display:flex;align-items:center;gap:16px;margin-top:6px}
.xp .pp-radar{width:108px;height:108px;flex:0 0 auto}
.xp .pp-radar .ring{fill:none;stroke:var(--line);stroke-width:1}
.xp .pp-radar .shape{fill:var(--leaf);fill-opacity:.32;stroke:var(--green);stroke-width:2;stroke-linejoin:round}
.xp .pp-radar .pt{fill:var(--green)}
.xp .pp-levels{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.xp .pp-levels>div{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.xp .pp-levels>div span{color:var(--muted);font-weight:600}
.xp .pp-levels b{font-weight:800;color:var(--ink)}
/* Trait tags: Heads-up = warning tags, Good to know = brand tags, own tag = dashed Add chip */
.xp .pp-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.xp .pp-good{background:var(--mint);color:var(--ink)}
.xp .pp-add{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px dashed #7F6F58;background:var(--card);color:var(--green);font-weight:800;font-size:13px}
.xp .pp-tags .tag{align-self:center}
.xp .pp-k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
/* Care task rows */
.xp .pp-task{display:flex;align-items:center;gap:12px;padding:6px 14px 6px 8px;min-height:58px;border-top:1px solid var(--line)}
.xp .pp-task:first-child{border-top:0}
.xp .pp-task svg.art{width:44px;height:44px;border-radius:14px;flex:0 0 auto}
.xp .pp-task>div{flex:1;min-width:0}
.xp .pp-task .go{width:20px;height:20px;flex:0 0 auto;color:var(--muted)}
/* Form fields (profile) */
.xp .pp-field{display:flex;flex-direction:column;gap:6px}
.xp .pp-label{font-size:13px;font-weight:700;color:var(--muted)}
.xp .pp-input{display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:16px;background:var(--card);border:1.5px solid #7F6F58;font-size:15px;font-weight:600;color:var(--text)}
.xp .pp-gallery{display:flex;gap:12px;margin-top:8px}
.xp .pp-gtile{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;flex:0 0 auto}
.xp .pp-gtile .photo{width:64px;height:64px;border-radius:50%}
.xp .pp-gtile .photo.cover{box-shadow:0 0 0 3px var(--gold)}
.xp .pp-gtile small{font-size:11.5px;font-weight:800;color:var(--gold-ink)}
.xp .pp-gtile .pp-plus{width:64px;height:64px;font-size:26px;align-self:auto}
.xp .pp-down{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.xp .pp-li{padding:7px 16px;min-height:52px}
.xp .pp-li>span:first-child{flex:1;min-width:0}
.xp .pp-li small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp .pp-ok{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:800;background:var(--ok-soft);color:var(--ok);margin-left:6px}
.xp .pp-note{border-radius:18px;padding:10px 14px;font-size:13px;font-weight:600;line-height:1.45;color:var(--ink)}
/* Schedule: month grid, three bands per day (night top, morning bottom) */
.xp .pp-cal{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.xp .pp-month{display:flex;align-items:center;justify-content:space-between}
.xp .pp-month b{font:600 19px/1 var(--display);color:var(--ink)}
.xp .pp-nav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--green)}
.xp .pp-nav svg{width:20px;height:20px}
.xp .pp-nav.off{color:var(--line)}
.xp .pp-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.xp .pp-wd{text-align:center;font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.xp .pp-day{height:48px;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding:3px 4px 4px;background:var(--card);border:1.5px solid var(--line)}
.xp .pp-day i{height:5px;flex:0 0 auto;border-radius:3px;background:var(--line)}
.xp .pp-day i.on{background:var(--leaf)}
.xp .pp-day b{order:-1;flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--ink);line-height:1}
.xp .pp-day.past{opacity:.38}
.xp .pp-day.today b{color:var(--green);text-decoration:underline;text-underline-offset:2px}
.xp .pp-day.sel{border:2.5px solid var(--ink)}
.xp .pp-blank{height:48px}
.xp .pp-legend{display:flex;gap:16px;padding-top:4px}
.xp .pp-legend span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.xp .pp-legend i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.xp .pp-legend i.on{background:var(--leaf)}
.xp .pp-slots{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.xp .pp-slot{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 12px 8px 14px;border-radius:18px;background:var(--cream)}
.xp .pp-slot>div{flex:1;min-width:0}
.xp .pp-slot .b{font-size:15px}
/* Owner for the sitter */
.xp .pp-person{display:flex;align-items:center;gap:14px;padding:16px}
.xp .pp-person .photo{width:80px;height:80px;border-radius:50%;flex:0 0 auto;border:3px solid #fff}
.xp .pp-person>div:last-child{flex:1;min-width:0}
.xp .pp-kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;min-height:54px;border-top:1px solid var(--line);font-size:14.5px}
.xp .pp-kv:first-child{border-top:0}
.xp .pp-kv span{color:var(--muted);font-weight:700}
.xp .pp-kv b{font-weight:800;text-align:right}
.xp .pp-stay{padding:16px 16px 4px}
.xp .pp-open{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-top:10px;border-top:1px solid var(--line);color:var(--green);font-weight:800;font-size:14px}
.xp .pp-open svg{width:18px;height:18px}
/* snap.html */
/* Snap detail pages (Treat check, Recent checks, Mood, Sticker). Tool colours follow the Snap tab: Treat peach, Mood mint, Sticker butter. */
.xp .sn-top{padding-bottom:4px}
.xp .sn-pick{display:flex;flex-direction:column;gap:8px}
.xp .sn-pick .k{color:var(--muted)}
/* Treat check: the label photo being read */
.xp .sn-shot{position:relative;height:178px;border-radius:22px;background:#E6D3B3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.xp .sn-label{width:236px;background:#FFFDF7;border-radius:14px;padding:12px 14px;box-shadow:0 6px 18px rgba(27,67,50,.18);display:flex;flex-direction:column;gap:6px}
.xp .sn-label .nm{font:600 18px/1.1 var(--display);color:#7A3E12}
.xp .sn-label .ing{font-size:11.5px;line-height:1.45;color:#3B3B36}
.xp .sn-label .ln{height:6px;border-radius:3px;background:#E9E2D2}
.xp .sn-scan{position:absolute;left:18px;right:18px;top:122px;height:3px;border-radius:2px;background:var(--leaf);box-shadow:0 0 12px 3px rgba(82,183,136,.55)}
.xp .sn-corner{position:absolute;width:26px;height:26px;border-color:#fff;border-style:solid;border-width:0}
.xp .sn-corner.a{left:14px;top:14px;border-left-width:4px;border-top-width:4px;border-top-left-radius:10px}
.xp .sn-corner.b{right:14px;top:14px;border-right-width:4px;border-top-width:4px;border-top-right-radius:10px}
.xp .sn-corner.c{left:14px;bottom:14px;border-left-width:4px;border-bottom-width:4px;border-bottom-left-radius:10px}
.xp .sn-corner.d{right:14px;bottom:14px;border-right-width:4px;border-bottom-width:4px;border-bottom-right-radius:10px}
.xp .sn-steps{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.xp .sn-step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.xp .sn-step.next{color:var(--muted)}
.xp .sn-spin{width:22px;height:22px;flex:none;border-radius:50%;border:3px solid rgba(27,67,50,.18);border-top-color:var(--green)}
.xp .sn-ring{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid #9A8F7E}
.xp .btn.sn-off{background:var(--line);color:var(--muted)}
.xp .sn-it{grid-template-columns:52px 1fr auto}
.xp .sn-it>div{min-width:0} .xp .sn-it .sm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp .sn-note{margin:0;text-align:center;font-size:12.5px;color:var(--muted)}
/* Treat check: the Safe result */
.xp .sn-ok{background:var(--ok-soft)}
.xp .sn-ok .mid{color:var(--ok)}
.xp .sn-prod{display:flex;align-items:center;gap:12px}
.xp .sn-prod svg.art{width:48px;height:48px;flex:none;border-radius:14px;background:var(--peach)}
.xp .sn-prod>div{flex:1;min-width:0}
.xp .sn-scale{display:flex;gap:6px;margin-top:14px}
.xp .sn-scale>div{flex:1;display:flex;flex-direction:column;gap:5px}
.xp .sn-scale i{display:block;height:8px;border-radius:4px;background:rgba(27,67,50,.14)}
.xp .sn-scale span{font-size:12px;font-weight:700;color:var(--muted)}
.xp .sn-scale .on i{background:var(--ok)}
.xp .sn-scale .on span{color:var(--ok);font-weight:800}
.xp .sn-rule{height:1px;background:rgba(6,118,71,.18);margin:14px 0 10px}
.xp .sn-kvs{display:flex;flex-direction:column;gap:6px}
.xp .sn-kvs .kv b{color:var(--ok)}
.xp .sn-src .li{padding:10px 14px 10px 16px}
.xp .sn-src .li>span{flex:1;min-width:0;color:var(--link)}
.xp .sn-src .li small{color:var(--muted)}
.xp .sn-tb{display:flex;align-items:center;min-height:44px;color:var(--link);font-weight:800;font-size:14px}
/* Recent checks */
.xp .sn-day{font:800 11.5px/1 "Plus Jakarta Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.xp .sn-list{display:flex;flex-direction:column;gap:8px}
.xp .sn-list .it svg.art{background:var(--peach)}
/* Mood */
.xp .sn-pic{position:relative;height:196px;border-radius:22px;background-size:cover;background-position:50% 40%}
.xp .sn-box{position:absolute;left:78px;top:14px;width:228px;height:168px;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 2px var(--green)}
.xp .sn-boxtag{position:absolute;left:8px;top:8px;background:var(--green);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.xp .sn-moods{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.xp .sn-mrow{display:flex;align-items:center;gap:10px;font-size:13px}
.xp .sn-mrow .lb{width:104px;flex:none}
.xp .sn-mrow .bar{flex:1;min-width:0;height:8px;border-radius:4px;background:rgba(255,255,255,.85);overflow:hidden}
.xp .sn-mrow .bar i{display:block;height:8px;border-radius:4px;background:#9DBFA9}
.xp .sn-mrow .vl{width:38px;flex:none;text-align:right;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.xp .sn-mrow.sn-hi{font-weight:800;color:var(--ink)} .xp .sn-mrow.sn-hi .bar i{background:var(--green)} .xp .sn-mrow.sn-hi .vl{color:var(--ink)}
/* Sticker */
.xp .sn-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xp .sn-src-photo{position:relative;height:208px;border-radius:22px;background-size:cover;background-position:50% 45%}
.xp .sn-dot{position:absolute;left:66px;top:66px;width:22px;height:22px;border-radius:50%;background:var(--green);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.xp .sn-cut{height:208px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.xp .sn-sticker{width:140px;height:122px;border-radius:52% 48% 46% 54% / 58% 56% 44% 42%;border:5px solid #fff;background-size:250%;background-position:44% 46%;box-shadow:0 6px 14px rgba(27,67,50,.22)}
.xp .sn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.xp .sn-tile{position:relative;height:116px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.xp .sn-tile .sn-sticker{width:72px;height:64px;border-width:3px;box-shadow:0 3px 8px rgba(27,67,50,.2)}
.xp .sn-hit{position:absolute;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.xp .sn-hit.tr{right:0;top:0} .xp .sn-hit.br{right:0;bottom:0}
.xp .sn-hit span{width:28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--ink);box-shadow:0 1px 4px rgba(27,67,50,.18)}
.xp .sn-hit svg{width:16px;height:16px}
.xp .sn-tbs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.xp .sn-tbs span{display:flex;align-items:center;justify-content:center;min-height:44px;color:var(--link);font-weight:800;font-size:15px}
/* fragments:end */

<div id="out"></div>
<script>
  addEventListener("hashchange", () => location.reload());
  const skin = new URLSearchParams(location.search).get("skin");
  if (skin) document.documentElement.dataset.skin = skin;
  const id = location.hash.slice(1) || "owner-home";
  const t = (skin === "d" && document.getElementById("x-" + id)) || document.getElementById("s-" + id) || document.getElementById("s-owner-home");
  const out = document.getElementById("out"); out.appendChild(t.content.cloneNode(true));
  out.querySelectorAll(".phone").forEach((p) => {
    const bar = document.getElementById("bar").content.cloneNode(true);
    bar.querySelector("h4").textContent = p.dataset.title;
    if (p.dataset.ava) bar.querySelector(".ava").textContent = p.dataset.ava;
    p.prepend(bar);
    const tabs = document.getElementById("tabbar").content.cloneNode(true);
    // Pushed screens (Settings, What's New) open from Profile, so they have no tab bar.
    if (p.dataset.tab !== "none") { const on = tabs.querySelector(`[data-t="${p.dataset.tab}"]`); if (on) on.classList.add("on"); p.append(tabs); }
  });
  out.querySelectorAll(".pixel-room canvas").forEach((c) => {
    const img = new Image(); img.onload = () => { const x = c.getContext("2d"); x.imageSmoothingEnabled = false;
      const s = Math.min(img.width, img.height); x.drawImage(img, (img.width - s) / 2, (img.height - s) / 4, s, s, 0, 0, 24, 24); };
    img.src = c.dataset.src;
  });
</script>
